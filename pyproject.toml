[project]
name = "inspire-json-merger"
version = "11.0.46"
description = "INSPIRE-specific configuration of the JSON Merger."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "CERN", email = "admin@inspirehep.net" },
]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "inspire-utils~=3.0,>=3.0.70",
    "json-merger[contrib]~=0.0,>=0.7.19",
    "pyrsistent~=0.20,>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/inspirehep/inspire-json-merger"
Repository = "https://github.com/inspirehep/inspire-json-merger"

[project.optional-dependencies]
docs = []
tests = [
    "inspire-schemas>=61.6.35,<62.0.0",
    "pytest-cov~=7.0,>=7.1.0",
    "pytest~=9.0,>=9.1.1",
]
dev = [
    "pre-commit==4.6.2",
]
all = [
    "inspire-schemas>=61.6.35,<62.0.0",
    "pytest-cov~=7.0,>=7.1.0",
    "pytest~=9.0,>=9.1.1",
    "pre-commit==4.6.2",
]

[tool.poetry]
packages = [
    { include = "inspire_json_merger" },
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--cov=inspire_json_merger --cov-report=term-missing:skip-covered"

[tool.coverage.run]
include = ["inspire_json_merger/*.py"]
